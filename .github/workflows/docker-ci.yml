# ==============================================================================
# WaveLink Fullstack CI/CD Pipeline
# - CI: Kiểm tra chất lượng Go Backend (1.26) & React Vite Frontend (Node 20, Vitest)
# - Docker Validation: Kiểm tra cú pháp Compose (Dev, Prod, VPS-API 2-containers)
# - CD: Tự động Cập nhật Packages, Build & Publish Docker Image lên GHCR
# - Tối ưu tài nguyên: Server nhỏ/VPS chỉ cần `docker compose pull`, KHÔNG tốn RAM build.
# ==============================================================================

name: WaveLink CI/CD & Multi-Environment Delivery

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  # Cho phép repo chứa packages kích hoạt pipeline từ xa qua API
  repository_dispatch:
    types: [package-updated]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

permissions:
  contents: write # Cấp quyền ghi để tự động commit lại lockfile mới vào repo
  packages: write # Cho phép push Docker Image lên GHCR

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Test & Kiểm tra chất lượng mã nguồn Backend Golang
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test & Lint (Go 1.26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Golang Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Update Target Package & Verify
        working-directory: backend
        run: |
          # Bỏ comment dòng dưới và thay tên package nếu cần ép tải bản mới nhất:
          # go get -u <duong-dan-repo-package>@latest
          go mod tidy
          go mod verify

      - name: Run Go Vet & Static Checks
        working-directory: backend
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        working-directory: backend
        run: go test -v ./...

  # ----------------------------------------------------------------------------
  # JOB 2: Test & Kiểm tra chất lượng mã nguồn Frontend React Vite
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Test & Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Suite (74 tests)
        working-directory: frontend
        run: npm run test

      - name: Verify Production Vite Build (TypeScript + Minification)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://wavelink-audio-app-backend-latest.onrender.com/api/v1' }}
          VITE_ITEMS_PER_PAGE: 12
        run: npm run build

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ----------------------------------------------------------------------------
  # JOB 3: Build & Publish Docker Images lên GHCR & CD Deploy Hook
  # ----------------------------------------------------------------------------
  docker-delivery:
    name: Docker Validate, Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Golang for Updating Packages
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Cập nhật package Go trực tiếp vào workspace trước khi Docker đóng gói
      - name: Force Update Go Dependencies
        working-directory: backend
        run: |
          # Thay bằng đường dẫn package cụ thể nếu cần, ví dụ:
          # go get -u github.com/username/my-package@latest
          go get -u ./...
          go mod tidy

      # Tự động commit và push lockfile mới lên main nếu có thay đổi
      - name: Commit and Push Updated Lockfile
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/go.mod backend/go.sum
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(deps): update packages lockfile [skip ci]"
            git push origin main
          else
            echo "Lockfile không có thay đổi."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize Image Names to Lowercase
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_LOWER=${REPO_LOWER}-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_LOWER=${REPO_LOWER}-frontend" >> $GITHUB_ENV

      - name: Validate Unified Docker Compose Configurations
        run: |
          docker compose config --quiet
          docker compose --profile fullstack config --quiet
          docker compose --env-file env.vps.example config --quiet
          docker compose --env-file env.dev.example config --quiet
          echo "File docker-compose.yml đạt chuẩn cấu hình."

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_LOWER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_LOWER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || 'https://wavelink-audio-app-backend-latest.onrender.com/api/v1' }}
            VITE_ITEMS_PER_PAGE=12

      - name: Trigger Render Auto-Deploy Hook
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Đang gửi tín hiệu Deploy Hook tới Render..."
            curl -s -f -X POST "$RENDER_DEPLOY_HOOK_URL" || echo "Cảnh báo: Không thể gọi Render Deploy Hook."
          else
            echo "Bỏ qua Render Deploy Hook (Chưa thiết lập RENDER_DEPLOY_HOOK_URL hoặc RENDER_DEPLOY_HOOK)."
          fi

      - name: Check FTP Secret
        id: check_ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -n "$FTP_SERVER" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      # Chuyển sang chuẩn 100% "Trích xuất từ Docker Package GHCR"
      - name: Extract Frontend Package from GHCR Docker Image
        if: steps.check_ftp.outputs.enabled == 'true'
        run: |
          echo ">>> Đang trích xuất static package từ Docker Image GHCR..."
          rm -rf ./frontend/dist-extracted
          mkdir -p ./frontend/dist-extracted
          # Khởi tạo container tạm thời từ Docker Image GHCR vừa đóng gói để copy static assets
          docker create --name fe_pkg_extract ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_LOWER }}:latest
          docker cp fe_pkg_extract:/usr/share/nginx/html/. ./frontend/dist-extracted/
          docker rm fe_pkg_extract
          # Đảm bảo file .htaccess điều hướng SPA luôn có mặt trong package deploy
          cp ./frontend/public/.htaccess ./frontend/dist-extracted/.htaccess || true
          echo ">>> Trích xuất thành công! Danh sách tệp tin trong package:"
          ls -la ./frontend/dist-extracted/

      - name: Resolve FTP Target Directory
        if: steps.check_ftp.outputs.enabled == 'true'
        id: ftp_dir
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          if [ -n "$FTP_SERVER_DIR" ]; then
            echo "target_dir=$FTP_SERVER_DIR" >> $GITHUB_OUTPUT
          elif [ "$FTP_USERNAME" = "wavelink" ]; then
            echo "target_dir=./domains/wavelink-audio-app.zhost.education/public_html/" >> $GITHUB_OUTPUT
          else
            echo "target_dir=./public_html/" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via FTP (Optional DirectAdmin)
        if: steps.check_ftp.outputs.enabled == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist-extracted/
          server-dir: ${{ steps.ftp_dir.outputs.target_dir }}
          dangerous-clean-slate: false

      - name: Report CI/CD Status
        run: |
          echo "TOÀN BỘ PIPELINE ĐÃ HOÀN TẤT THÀNH CÔNG!"
          echo "• Đã tự động cập nhật dependency mới nhất"
          echo "• Đã kiểm thử Backend & Frontend"
          echo "• Đã build và đẩy image mới lên GHCR"