# ==============================================================================
# WaveLink Fullstack CI/CD Pipeline
# - CI: Kiểm tra chất lượng Go Backend (1.24) & React Vite Frontend (Node 20, Vitest)
# - Docker Validation: Kiểm tra cú pháp Compose (Dev, Prod, VPS-API 2-containers)
# - CD: Tự động Build & Publish Docker Image lên GitHub Container Registry (ghcr.io)
#       khi có commit mới vào nhánh main hoặc gắn release tag.
# - Tối ưu tài nguyên: Server nhỏ/VPS chỉ cần `docker compose pull`, KHÔNG tốn RAM build.
# ==============================================================================

name: WaveLink CI/CD & Multi-Environment Delivery

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

permissions:
  contents: read
  packages: write # Cho phép push Docker Image lên GHCR

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Test & Kiểm tra chất lượng mã nguồn Backend Golang
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test & Lint (Go 1.24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Golang Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Verify Go Modules
        working-directory: backend
        run: |
          go mod download
          go mod verify

      - name: Run Go Vet & Static Checks
        working-directory: backend
        run: go vet ./...

      - name: Run Go Unit & Integration Tests
        working-directory: backend
        run: go test -v ./...

  # ----------------------------------------------------------------------------
  # JOB 2: Test & Kiểm tra chất lượng mã nguồn Frontend React Vite
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Test & Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Suite (74 tests)
        working-directory: frontend
        run: npm run test

      - name: Verify Production Vite Build (TypeScript + Minification)
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # JOB 3: Build & Publish Docker Images lên GHCR & CD Deploy Hook
  # ----------------------------------------------------------------------------
  docker-delivery:
    name: Docker Validate, Build & Push (GHCR)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bắt buộc chuyển tên Repo về chữ thường (lowercase) theo chuẩn GHCR / OCI
      - name: Normalize Image Names to Lowercase
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_LOWER=${REPO_LOWER}-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE_LOWER=${REPO_LOWER}-frontend" >> $GITHUB_ENV

      - name: Validate Unified Docker Compose Configurations
        run: |
          docker compose config --quiet
          docker compose --profile fullstack config --quiet
          docker compose --env-file env.vps.example config --quiet
          docker compose --env-file env.dev.example config --quiet
          echo "✅ File docker-compose.yml duy nhất đạt chuẩn cho tất cả các profile và file env (env.vps, env.dev)!"

      # Đăng nhập GHCR (Chỉ thực hiện khi push vào main / tag hoặc chạy thủ công, không chạy trên PR)
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trích xuất metadata (tags, labels) cho Backend
      - name: Extract Docker metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_LOWER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      # Build & Push Backend Docker Image
      - name: Build and Push Backend Image
        run: |
          echo "=== BẮT ĐẦU BUILD BACKEND DOCKER IMAGE ==="
          BUILD_TAG_ARGS=""
          for tag in ${{ steps.meta-backend.outputs.tags }}; do
            BUILD_TAG_ARGS="$BUILD_TAG_ARGS -t $tag"
          done
          docker build --progress=plain $BUILD_TAG_ARGS -f backend/Dockerfile backend
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for tag in ${{ steps.meta-backend.outputs.tags }}; do
              echo "Pushing $tag to GHCR..."
              docker push $tag
            done
          fi

      # Trích xuất metadata (tags, labels) cho Frontend
      - name: Extract Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_LOWER }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      # Build & Push Frontend Docker Image
      - name: Build and Push Frontend Image
        run: |
          echo "=== BẮT ĐẦU BUILD FRONTEND DOCKER IMAGE ==="
          BUILD_TAG_ARGS=""
          for tag in ${{ steps.meta-frontend.outputs.tags }}; do
            BUILD_TAG_ARGS="$BUILD_TAG_ARGS -t $tag"
          done
          docker build --progress=plain \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            --build-arg VITE_ITEMS_PER_PAGE=12 \
            $BUILD_TAG_ARGS -f frontend/Dockerfile frontend
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for tag in ${{ steps.meta-frontend.outputs.tags }}; do
              echo "Pushing $tag to GHCR..."
              docker push $tag
            done
          fi

      # Trigger Render Deploy Hook (Tùy chọn nếu người dùng cấu hình RENDER_DEPLOY_HOOK_URL trong Repo Secrets)
      - name: Trigger Render Auto-Deploy Hook (Optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Đang gửi tín hiệu Deploy Hook tới Render..."
            curl -s -f -X POST "$RENDER_DEPLOY_HOOK_URL" || echo "Cảnh báo: Không thể gọi Render Deploy Hook."
          else
            echo "Bỏ qua Render Deploy Hook (RENDER_DEPLOY_HOOK_URL chưa được thiết lập trong GitHub Secrets)."
          fi

      # CI/CD tự động bằng FTP (Tùy chọn nếu người dùng cấu hình FTP_SERVER trong Repo Secrets)
      - name: Check FTP Secret
        id: check_ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -n "$FTP_SERVER" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via FTP (Optional DirectAdmin)
        if: steps.check_ftp.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false

      - name: Report CI/CD Status
        run: |
          echo "TOÀN BỘ PIPELINE ĐÃ HOÀN TẤT THÀNH CÔNG!"
          echo "• Đã kiểm thử Backend & Frontend"
          echo "• Đã xác thực 3 cấu hình Docker Compose"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "• Đã đóng gói và đẩy image lên GitHub Container Registry:"
            echo "  -> Backend:  ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_LOWER }}:latest"
            echo "  -> Frontend: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_LOWER }}:latest"
            echo "• Server nhỏ / VPS Ubuntu chỉ cần 'docker compose pull' mà không bị cạn RAM build!"
          fi

