# ==============================================================================
# WaveLink - Render Blueprint Specification (Infrastructure as Code)
# ==============================================================================

services:
  - type: web
    name: wavelink-backend-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DB_DRIVER
        value: mysql
      - key: DB_SOURCE
        sync: false # Nhập chuỗi kết nối Aiven MySQL trong Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render tự động sinh chuỗi secret ngẫu nhiên bảo mật cao
      - key: ALLOWED_ORIGINS
        value: "https://wavelink-audio-app.zhost.education,https://*.vercel.app,https://wavelink-audio-app.vercel.app,http://localhost:5173"
      - key: EPISODE_BLOCK_SECONDS
        value: "14400"
      - key: DB_MAX_OPEN_CONNS
        value: "25"
      - key: DB_MAX_IDLE_CONNS
        value: "10"
      - key: DB_CONN_MAX_LIFETIME_MINUTES
        value: "15"
      - key: DB_CONN_MAX_IDLE_TIME_MINUTES
        value: "3"
      - key: VIETQR_BANK_NAME
        value: "MB Bank (Quân Đội)"
      - key: VIETQR_ACCOUNT_NUMBER
        value: "0987654321"
      - key: VIETQR_ACCOUNT_NAME
        value: "COMIC AUDIO HUB"
      - key: VIETQR_NOTE_PREFIX
        value: "VIP"
