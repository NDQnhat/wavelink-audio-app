<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>YouTube Audio Library - Trải Nghiệm Nghe Cá Nhân Hóa</title>
  
  <!-- Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#630ed4",
            "primary-container": "#7c3aed",
            "on-primary": "#ffffff",
            "primary-fixed": "#eaddff",
            "on-primary-fixed-variant": "#5a00c6",
            "secondary": "#0051d5",
            "secondary-container": "#316bf3",
            "secondary-fixed": "#dbe1ff",
            "tertiary": "#005c25",
            "tertiary-container": "#007732",
            "tertiary-fixed": "#7ffc97",
            "tertiary-fixed-dim": "#62df7d",
            "surface": "#f8f9ff",
            "surface-container": "#e5eeff",
            "surface-container-low": "#eff4ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-high": "#dce9ff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#4a4455",
            "outline": "#7b7487",
            "error": "#ba1a1a"
          },
          fontFamily: {
            "body-md": ["Inter", "sans-serif"],
            "code-sm": ["JetBrains Mono", "monospace"]
          },
          spacing: {
            "margin-sm": "1rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "0.75rem",
            "space-base": "1rem",
            "space-lg": "1.5rem"
          }
        }
      }
    };
  </script>
  
  <style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    html.dark body {
      background-color: #0b1320 !important;
      color: #e5eeff !important;
    }
    html.dark header, html.dark nav, html.dark .bg-surface-container-lowest {
      background-color: #111c2e !important;
      color: #e5eeff !important;
      border-color: #1e2e47 !important;
    }
    html.dark .bg-surface-container-low, html.dark .bg-surface-container {
      background-color: #19273c !important;
      color: #e5eeff !important;
    }
    html.dark .text-on-surface {
      color: #f0f4fc !important;
    }
    html.dark .text-on-surface-variant {
      color: #94a3b8 !important;
    }
  </style>
</head>

<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen">
  
  <!-- 1. HEADER CHUNG (SHARED HEADER) -->
  <header class="fixed top-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
    <div class="h-16 px-margin-sm flex items-center justify-between gap-space-sm max-w-lg mx-auto">
      <div class="flex items-center gap-space-sm min-w-0 cursor-pointer" onclick="location.hash='#/home'">
        <div class="w-9 h-9 rounded-xl bg-primary-container text-on-primary flex items-center justify-center font-bold shadow-sm">
          <span class="material-symbols-outlined text-[22px]">graphic_eq</span>
        </div>
        <div class="flex flex-col min-w-0">
          <span class="font-bold text-lg text-on-surface truncate leading-tight">Audio Library</span>
          <span class="text-xs text-on-surface-variant truncate">YouTube Audio Engine</span>
        </div>
      </div>
      <div class="flex items-center gap-space-xs">
        <button onclick="location.hash='#/library'" aria-label="Tìm kiếm" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface transition-colors">
          <span class="material-symbols-outlined text-[22px]">search</span>
        </button>
        <button onclick="location.hash='#/upload'" aria-label="Thêm mới" class="w-10 h-10 flex items-center justify-center rounded-full bg-primary-container text-on-primary hover:bg-primary transition-colors shadow-sm">
          <span class="material-symbols-outlined text-[20px]">add</span>
        </button>
        <button onclick="location.hash='#/profile'" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-1">
          <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 2. NỘI DUNG THAY ĐỔI ĐỘNG (DYNAMIC APP MAIN VIEW) -->
  <main id="app-main" class="flex-1 flex flex-col relative w-full pt-16 max-w-lg mx-auto">
    <!-- Nội dung sẽ được render động từ JSON qua app.js -->
  </main>

  <!-- 3. MINI PLAYER THƯỜNG TRỰC DÀNH CHO BẤT KỲ TRANG NÀO (PERSISTENT MINI PLAYER) -->
  <aside id="mini-player-container" class="fixed bottom-[68px] inset-x-0 z-40 px-margin-sm pb-space-xs pointer-events-none hidden">
    <!-- Render động từ player.js -->
  </aside>

  <!-- 4. BOTTOM NAVIGATION DÙNG CHUNG (SHARED BOTTOM NAV) -->
  <nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_-4px_20px_rgba(15,23,42,0.06)] border-t border-surface-container-high/60">
    <div class="relative flex justify-around items-center h-[68px] px-2 max-w-lg mx-auto">
      <a data-path="home" href="#/home" class="flex flex-col items-center justify-center flex-1 py-1 gap-1 text-primary font-semibold transition-all duration-200 active:scale-95">
        <span class="material-symbols-outlined text-[24px]">home</span>
        <span class="text-[11px] font-medium tracking-tight">Trang chủ</span>
      </a>
      
      <a data-path="library" href="#/library" class="flex flex-col items-center justify-center flex-1 py-1 gap-1 text-on-surface-variant hover:text-primary transition-all duration-200 active:scale-95">
        <span class="material-symbols-outlined text-[24px]">video_library</span>
        <span class="text-[11px] font-medium tracking-tight">Thư viện</span>
      </a>

      <!-- FAB Tải lên nổi bật -->
      <div class="relative flex flex-col items-center justify-center flex-1 -mt-7">
        <div class="absolute -top-1 w-16 h-8 bg-surface-container-lowest rounded-b-full border-b border-surface-container-high/60 shadow-xs pointer-events-none"></div>
        <button onclick="location.hash='#/upload'" aria-label="Tải lên âm thanh" class="relative z-10 w-12 h-12 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-[0_8px_20px_rgba(124,58,237,0.35)] ring-4 ring-surface-container-lowest hover:shadow-[0_10px_24px_rgba(124,58,237,0.45)] hover:scale-105 active:scale-95 transition-all duration-300">
          <span class="material-symbols-outlined text-[26px] font-bold">add</span>
        </button>
        <span class="relative z-10 text-[11px] text-primary-container font-semibold tracking-tight mt-1">Nhập link</span>
      </div>

      <a id="nav-community" data-path="community" href="#/community" class="flex flex-col items-center justify-center flex-1 py-1 gap-1 text-on-surface-variant hover:text-primary transition-all duration-200 active:scale-95 hidden">
        <span class="material-symbols-outlined text-[24px]">forum</span>
        <span class="text-[11px] font-medium tracking-tight">Cộng đồng</span>
      </a>

      <a id="nav-admin" data-path="admin" href="#/admin" class="flex flex-col items-center justify-center flex-1 py-1 gap-1 text-on-surface-variant hover:text-primary transition-all duration-200 active:scale-95 hidden">
        <span class="material-symbols-outlined text-[24px]">grid_view</span>
        <span class="text-[11px] font-medium tracking-tight">Quản lý</span>
      </a>

      <a data-path="profile" href="#/profile" class="flex flex-col items-center justify-center flex-1 py-1 gap-1 text-on-surface-variant hover:text-primary transition-all duration-200 active:scale-95">
        <span class="material-symbols-outlined text-[24px]">person</span>
        <span class="text-[11px] font-medium tracking-tight">Cá nhân</span>
      </a>
    </div>
  </nav>

  <!-- Script Module Bootstrap -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
